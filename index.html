<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тех-нора — настройки и решения</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-glow"></div>
  <header>
    <div class="logo-row">
      <div class="logo-mark">
        <svg class="logo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="tnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#5ee7ff"/>
              <stop offset="40%" stop-color="#1a8cff"/>
              <stop offset="100%" stop-color="#0050d0"/>
            </linearGradient>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
              <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <ellipse class="orbit o1" cx="100" cy="100" rx="88" ry="32" fill="none" stroke="#1ad4ff" stroke-width="3" opacity="0.85"/>
          <ellipse class="orbit o2" cx="100" cy="100" rx="88" ry="32" fill="none" stroke="#4dc9ff" stroke-width="2" opacity="0.5"/>
          <g filter="url(#glow)" fill="url(#tnGrad)">
            <path d="M30 45 h140 v28 H115 v82 H85 V73 H30 Z"/>
            <path d="M55 78 L95 145 H115 V78 H130 V160 H95 L55 95 V160 H40 V78 Z"/>
          </g>
        </svg>
      </div>
      <div>
        <h1>Тех-нора</h1>
        <p class="subtitle">Любая настройка · любой вопрос · рабочий способ</p>
      </div>
    </div>
  </header>

  <div class="search-wrap glass">
    <input type="text" id="searchInput" placeholder="Что хочешь сделать? Например: два WhatsApp, передать файл, ускорить телефон..." autocomplete="off">
    <button type="button" id="searchBtn">Найти</button>
  </div>
  <div class="search-hints">Попробуй: два аккаунта · DeX · бэкап Samsung · AirDrop на Windows · автояркость · sideload</div>

  <div class="filters" id="filters">
    <button type="button" class="filter-btn active" data-platform="all">Все</button>
    <button type="button" class="filter-btn" data-platform="ios">iOS</button>
    <button type="button" class="filter-btn" data-platform="android">Android</button>
    <button type="button" class="filter-btn" data-platform="windows">Windows</button>
    <button type="button" class="filter-btn" data-platform="macos">macOS</button>
    <button type="button" class="filter-btn" data-platform="cross">Между устройствами</button>
    <button type="button" class="filter-btn" data-platform="software">Программы</button>
    <button type="button" class="filter-btn" data-platform="brand">Бренды</button>
  </div>

  <div id="results-info" class="results-info"></div>
  <main id="content"></main>

  <footer class="glass">
    <strong>Тех-нора</strong> — всегда есть способ. Опиши задачу — получи инструкцию.
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
