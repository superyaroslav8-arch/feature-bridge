<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fixly — как настроить любое устройство</title>
  <meta name="description" content="Умный справочник: введи проблему — получи точную инструкцию для iPhone, Android, Windows, Mac и программ.">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='22' width='100' height='100' fill='%230ea5e9'/><text x='50' y='68' font-size='58' text-anchor='middle' fill='white' font-family='system-ui' font-weight='700'>F</text></svg>">
</head>
<body>
  <header>
    <div class="logo-row">
      <div class="logo-mark">F</div>
      <div>
        <h1>Fixly</h1>
        <p class="tagline">Как настроить любое устройство</p>
      </div>
    </div>
    <p class="subtitle">Введи проблему или что хочешь сделать — получи готовую инструкцию</p>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Например: передать файл с iPhone на Windows, два WhatsApp, DeX, split screen, бэкап..." autocomplete="off" autofocus>
    <button id="searchBtn" onclick="doSearch()">Найти</button>
  </div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-platform="all" onclick="setFilter('all')">Все</button>
    <button class="filter-btn" data-platform="ios" onclick="setFilter('ios')">iOS</button>
    <button class="filter-btn" data-platform="android" onclick="setFilter('android')">Android</button>
    <button class="filter-btn" data-platform="windows" onclick="setFilter('windows')">Windows</button>
    <button class="filter-btn" data-platform="macos" onclick="setFilter('macos')">macOS</button>
    <button class="filter-btn" data-platform="cross" onclick="setFilter('cross')">Между устройствами</button>
    <button class="filter-btn" data-platform="software" onclick="setFilter('software')">Программы</button>
  </div>

  <div id="results-info" class="results-info"></div>
  <main id="content"></main>

  <footer>
    <p><strong>Fixly</strong> — справочник с умным поиском по проверенным инструкциям.<br>
    Настоящий генеративный ИИ требует сервер и ключ API. Здесь — быстрый и точный поиск по большой базе решений.</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
