<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тех-нора — настройки и решения для всех устройств</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect rx='20' width='100' height='100' fill='%230a0a0a'/><circle cx='50' cy='50' r='18' fill='none' stroke='%2300d4ff' stroke-width='6'/><circle cx='50' cy='50' r='6' fill='%2300d4ff'/></svg>">
</head>
<body>
  <header>
    <div class="logo-row">
      <div class="logo-mark" aria-label="Тех-нора">
        <svg class="logo-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle class="ring" cx="32" cy="32" r="22" stroke="currentColor" stroke-width="3.5"/>
          <circle class="core" cx="32" cy="32" r="8" fill="currentColor"/>
          <circle class="dot d1" cx="32" cy="10" r="3" fill="currentColor"/>
          <circle class="dot d2" cx="54" cy="32" r="3" fill="currentColor"/>
          <circle class="dot d3" cx="32" cy="54" r="3" fill="currentColor"/>
          <circle class="dot d4" cx="10" cy="32" r="3" fill="currentColor"/>
        </svg>
      </div>
      <div>
        <h1>Тех-нора</h1>
        <p class="subtitle">Настройки, функции и решения для любых устройств</p>
      </div>
    </div>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Опиши проблему или что хочешь сделать..." autocomplete="off">
    <button onclick="doSearch()">Найти</button>
  </div>
  <div class="search-hints">
    Примеры: два WhatsApp · передать файл с iPhone · включить DeX · автояркость Samsung · sideload · бэкап Xiaomi
  </div>

  <div class="filters">
    <button class="filter-btn active" data-platform="all" onclick="setFilter('all')">Все</button>
    <button class="filter-btn" data-platform="ios" onclick="setFilter('ios')">iOS</button>
    <button class="filter-btn" data-platform="android" onclick="setFilter('android')">Android</button>
    <button class="filter-btn" data-platform="windows" onclick="setFilter('windows')">Windows</button>
    <button class="filter-btn" data-platform="macos" onclick="setFilter('macos')">macOS</button>
    <button class="filter-btn" data-platform="cross" onclick="setFilter('cross')">Между устройствами</button>
    <button class="filter-btn" data-platform="software" onclick="setFilter('software')">Программы</button>
    <button class="filter-btn" data-platform="brand" onclick="setFilter('brand')">Бренды</button>
  </div>

  <div id="results-info" class="results-info"></div>
  <main id="content"></main>

  <footer>
    <p><strong>Тех-нора</strong> — справочник настроек и решений для устройств.<br>
    Поиск по описанию проблемы, функциям, брендам и программам.</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
